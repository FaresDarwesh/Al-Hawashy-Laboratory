<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تتبع الحجز | معمل الحوشي للتحاليل الطبية</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e7c86'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='Arial'>حـ</text></svg>">
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body>
<section class="section" style="padding-top:calc(var(--header-h) + 46px);min-height:80vh"> <div class="container" style="max-width:820px"> <div class="sec-head reveal"> <span class="eyebrow"> تتبع الحجز</span> <h2 class="mt-2">تابع حالة حجزك <span class="grad-text">لحظة بلحظة</span></h2> <p>اكتب رقم الحجز ورقم الموبايل — وهتعرف الحجز وصل لفين والنتيجة جاهزة ولا لسه.</p> </div> <div class="card reveal" style="padding:26px"> <div class="field-row"> <div class="field"><label>رقم الحجز</label><input id="tCode" class="input" placeholder="ELH-1001" dir="ltr"></div> <div class="field"><label>رقم الموبايل</label><input id="tPhone" class="input" inputmode="tel" placeholder="01XXXXXXXXX" dir="ltr"></div> </div> <button class="btn btn-primary w-full" id="tBtn">عرض حالة الحجز</button> <div id="tRes" class="mt-3"></div> </div> <div class="card reveal mt-3" style="padding:22px"> <h4> تتبع برقم الموبايل فقط</h4> <div class="field mt-2"><label>رقم الموبايل</label><input id="tAll" class="input" inputmode="tel" placeholder="01XXXXXXXXX" dir="ltr"></div> <button class="btn btn-outline w-full" id="tAllBtn">عرض كل حجوزاتي ونتائجه</button> <div id="tAllRes" class="mt-3"></div> </div> </div>
</section> <script src="assets/js/core.js?v=3"></script>
<script src="assets/js/supabase-config.js?v=3"></script>
<script src="assets/js/sync.js?v=3"></script>
<script src="assets/js/qr.js?v=3"></script>
<script src="assets/js/shared.js?v=3"></script>
<script>
(function(){
LAB.load(); LAB.buildShell('track.html');
var d = LAB.db();
var ST = {
pending:['في انتظار التأكيد','b-wait',1], confirmed:['مؤكد ','b-new',2],
sampled:['تم السحب ','b-prog',3], processing:['جاري التحليل ','b-prog',4],
ready:['النتيجة جاهزة ','b-done',5], done:['مكتمل ✔','b-done',5], cancelled:['ملغي ','b-cancel',0]
};
function timeline(st){
var steps=[['pending','تم الاستلام'],['confirmed','تم التأكيد'],['sampled','تم السحب'],['processing','جاري التحليل'],['ready','النتيجة جاهزة']];
var cur=(ST[st]||ST.pending)[2];
return '<div style="display:grid;gap:0">'+steps.map(function(s,i){
var on = i < cur;
return '<div style="display:flex;gap:12px;align-items:flex-start">'+
'<div style="display:grid;justify-items:center">'+
'<div style="width:26px;height:26px;border-radius:50%;background:'+(on?'var(--green)':'var(--line)')+';color:#fff;display:grid;place-items:center;font-size:13px;flex:none">'+(on?LAB.icon('check',15):(i+1))+'</div>'+
(i<steps.length-1?'<div style="width:2px;height:26px;background:'+(on?'var(--green)':'var(--line)')+'"></div>':'')+
'</div>'+
'<div style="padding-bottom:8px"><b style="font-size:14px;color:'+(on?'var(--text)':'var(--text-soft)')+'">'+s[1]+'</b></div></div>';
}).join('')+'</div>';
}
function card(b){
var st=ST[b.status]||ST.pending;
var br=d.branches.filter(function(x){return x.id===b.branchId;})[0];
var ar=d.areas.filter(function(x){return x.id===b.areaId;})[0];
return LAB.el('div',{class:'card',style:'padding:22px;margin-bottom:14px'},[
LAB.el('div',{class:'row-between'},[
LAB.el('div',{},[LAB.el('h4',{html:' '+b.code}),LAB.el('div',{class:'small',html:LAB.escapeHtml(b.patientName)+' — '+LAB.fmtDate(b.date)+' '+b.time})]),
LAB.el('span',{class:'badge '+st[1],html:st[0]})
]),
LAB.el('div',{class:'row',style:'gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap'},[
LAB.el('div',{style:'background:#fff;padding:6px;border-radius:12px;border:1px solid var(--line);line-height:0',html:LAB.qr(LAB.trackURL(b.code),104)}),
LAB.el('div',{class:'small',html:' امسح الكود للوصول السريع للحجز من أي جهاز'})
]),
LAB.el('div',{class:'grid g2 mt-2',style:'gap:18px'},[
LAB.el('div',{},[
LAB.el('div',{class:'small',html:' '+(b.sampleType==='home'?('سحب منزلي — '+LAB.escapeHtml((ar&&ar.name)||'')):LAB.escapeHtml((br&&br.name)||''))}),
LAB.el('div',{class:'small',html:' '+b.tests.length+' تحليل'+(b.packageId?' + باقة':'')}),
LAB.el('div',{class:'small',html:' '+(b.paymentMethod==='cash'?'كاش عند الكشف':'انستا باي')+' — <span class="badge '+(b.paymentStatus==='paid'?'b-paid':'b-unpaid')+'">'+(b.paymentStatus==='paid'?'مدفوع':(b.paymentStatus==='review'?'قيد المراجعة':'غير مدفوع'))+'</span>'}),
LAB.el('div',{class:'small',html:' الإجمالي: <b>'+LAB.money(b.total)+' ج</b>'})
]),
LAB.el('div',{html:timeline(b.status)})
]),
(b.paymentMethod==='instapay'&&b.paymentStatus!=='paid'&&!b.receipt)?LAB.el('div',{class:'mt-2'},[
LAB.el('div',{class:'small mb-1',html:' لم ترفع إيصال التحويل — حوّل على <b dir="ltr">'+d.settings.instapay+'</b> ثم ارفع الإيصال:'}),
LAB.el('button',{class:'btn btn-sm btn-outline',html:' رفع الإيصال',onclick:function(){ uploadReceipt(b); }})
]):null,
(b.resultNote||(b.files&&b.files.length))?LAB.el('div',{class:'pay-box mt-2'},[
LAB.el('b',{html:' النتيجة'}),
b.resultNote?LAB.el('p',{class:'small mt-1',html:LAB.escapeHtml(b.resultNote)}):null,
(b.files&&b.files.length)?LAB.el('div',{class:'preview-grid'},b.files.map(function(f){
return LAB.el('div',{class:'thumb'},[LAB.el('img',{src:f.url,onclick:function(){window.open(f.url);}})]);
})):null,
LAB.el('div',{class:'row mt-2'},[
LAB.el('button',{class:'btn btn-sm btn-success',html:' طباعة / حفظ PDF',onclick:function(){ printResult(b); }}),
LAB.el('a',{href:'patient.html',class:'btn btn-sm btn-ghost',html:'ملفي الطبي'})
])
]):null,
(b.status==='pending'||b.status==='confirmed')?LAB.el('div',{class:'row mt-2'},[
LAB.el('button',{class:'btn btn-sm btn-danger',html:'إلغاء الحجز',onclick:function(){
LAB.confirm('إلغاء الحجز','متأكد إنك عايز تلغي الحجز '+b.code+'؟',function(){
b.status='cancelled'; LAB.save(); LAB.log('إلغاء حجز '+b.code); LAB.toast('تم','تم إلغاء الحجز','ok'); render();
},'نعم، ألغي');
}}),
LAB.el('a',{href:'https://wa.me/'+d.settings.whatsapp,target:'_blank',class:'btn btn-sm btn-ghost',html:' استفسار'})
]):null
]);
}
function uploadReceipt(b){
var inp=LAB.el('input',{type:'file',accept:'image/*'});
inp.onchange=function(){
var f=this.files[0]; if(!f) return;
LAB.fileToDataURL(f,1000,.72,function(u){ b.receipt=u; b.paymentStatus='review'; LAB.save(); LAB.notify('إيصال جديد',b.code,'pay','admin'); LAB.toast('تم','تم رفع الإيصال — جاري المراجعة','ok'); render(); });
};
inp.click();
}
window.printResult=function(b){
var w=window.open('','_blank','width=820,height=900');
var rows=b.tests.map(function(n){var t=d.tests.filter(function(x){return x.name===n;})[0];return '<tr><td>'+n+'</td><td>'+(t?t.price:'-')+' ج</td></tr>';}).join('');
w.document.write('<html dir="rtl"><head><meta charset="utf-8"><title>نتيجة '+b.code+'</title>'+
'<style>body{font-family:Tahoma;padding:30px}table{width:100%;border-collapse:collapse;margin:16px 0}td,th{border:1px solid #ccc;padding:8px}h1{color:#0e7c86}</style></head><body>'+
'<h1>'+d.settings.labName+'</h1><p>'+d.settings.ownerName+' — '+d.settings.ownerTitle+'</p><hr>'+
'<h2>تقرير حجز '+b.code+'</h2><p>المريض: '+b.patientName+' | التاريخ: '+LAB.fmtDate(b.date)+' '+b.time+'</p>'+
'<table><tr><th>التحليل</th><th>السعر</th></tr>'+rows+'</table>'+
'<p>رسوم السحب: '+b.homeFee+' ج | الخصم: '+b.discount+' ج | <b>الإجمالي: '+b.total+' ج</b></p>'+
(b.resultNote?'<h3>ملاحظات النتيجة</h3><p>'+b.resultNote+'</p>':'')+
'<hr><p style="font-size:12px;color:#666">هذا التقرير صادر إلكترونياً من نظام '+d.settings.labName+'</p>'+
'<script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>');
w.document.close();
};
function render(){
var code=String($('#tCode').value||'').trim().toUpperCase();
var ph=LAB.validatePhone($('#tPhone').value);
var w=$('#tRes'); w.innerHTML='';
if(!code||!ph){ LAB.toast('مطلوب','اكتب رقم الحجز والموبايل','warn'); return; }
var b=d.bookings.filter(function(x){return x.code===code&&x.phone===ph;})[0];
if(!b){ w.innerHTML='<div class="empty"><span class="ic"></span>مفيش حجز بهذه البيانات — تأكد من رقم الحجز والموبايل</div>'; return; }
w.appendChild(card(b));
}
$('#tBtn').onclick=render;
$('#tAllBtn').onclick=function(){
var ph=LAB.validatePhone($('#tAll').value), w=$('#tAllRes'); w.innerHTML='';
if(!ph){ LAB.toast('خطأ','رقم غير صحيح','err'); return; }
var list=d.bookings.filter(function(b){return b.phone===ph;}).sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
if(!list.length){ w.innerHTML='<div class="empty"><span class="ic"></span>مفيش حجوزات مسجلة بهذا الرقم</div>'; return; }
list.slice(0,12).forEach(function(b){ w.appendChild(card(b)); });
};
LAB.initFX();
})();
</script>
</body>
</html>
